//  DAILY PASSAGE — AI generation
// ═══════════════════════════════════════════════
async function generatePassageAI() {
  const key = getGeminiKey();
  if (!key) return null;

  const seenTitles = JSON.parse(localStorage.getItem('ep_passage_seen') || '[]');

  const prompt = `You are an advanced English teacher. Generate a daily reading passage for a Japanese adult learner studying advanced English.

Do NOT use these topics already covered: ${seenTitles.slice(-20).join(', ')}

Return ONLY valid JSON, no markdown, no explanation:
{
  "title": "Engaging title (4-6 words)",
  "level": "Upper Intermediate or Advanced",
  "body": "A well-written passage of 120-150 words on an interesting topic (science, psychology, business, culture, technology, nature). Bold 3-4 key vocabulary words using <b>word</b> tags. Write in clear, sophisticated English.",
  "questions": [
    {
      "q": "Comprehension or vocabulary question about the passage",
      "opts": ["Option A", "Option B", "Option C", "Option D"],
      "ans": 0,
      "exp": "Brief explanation of why this answer is correct"
    },
    {
      "q": "Second question",
      "opts": ["Option A", "Option B", "Option C", "Option D"],
      "ans": 1,
      "exp": "Explanation"
    },
    {
      "q": "Third question — test a vocabulary word from the passage",
      "opts": ["Option A", "Option B", "Option C", "Option D"],
      "ans": 2,
      "exp": "Explanation"
    }
  ]
}`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        contents: [{parts:[{text: prompt}]}],
        generationConfig: {temperature: 0.9, maxOutputTokens: 1000}
      })
    });
    const data = await res.json();
    if (data.error) return null;
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    const clean = text.replace(/```json|```/g,'').trim();
    const passage = JSON.parse(clean);
    if (!passage.title || !passage.body || !passage.questions) return null;

    // Cache and record
    localStorage.setItem('ep_passage_today', JSON.stringify({date: todayStr(), passage}));
    const newSeen = [...seenTitles, passage.title];
    localStorage.setItem('ep_passage_seen', JSON.stringify(newSeen.slice(-50)));
    return passage;
  } catch(e) {
    console.warn('Passage AI failed:', e);
    return null;
  }
}

async function getTodayPassage() {
  const cached = JSON.parse(localStorage.getItem('ep_passage_today') || 'null');
  if (cached && cached.date === todayStr()) return cached.passage;

  if (getGeminiKey()) {
    try {
      const ai = await Promise.race([
        generatePassageAI(),
        new Promise(resolve => setTimeout(() => resolve(null), 6000))
      ]);
      if (ai) return ai;
    } catch(e) { /* silent fallback */ }
  }
  // Reliable built-in fallback — rotates through the day number so it still varies daily
  const day = getDayNumber();
  return PASSAGE_POOL[day % PASSAGE_POOL.length];
}

// ═══════════════════════════════════════════════
//  PASSAGE PAGE RENDERER
// ═══════════════════════════════════════════════
async function renderPassage() {
  const el = document.getElementById('passage-content');
  el.innerHTML = `<div class="empty-state"><div class="empty-title">Loading passage…</div><p>Fetching today's reading</p></div>`;

  const passage = await getTodayPassage();

  let qAnswered = 0;
  let qCorrect = 0;
  const total = passage.questions.length;

  el.innerHTML = `
    <div class="passage-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
        <div>
          <div class="passage-title">${passage.title}</div>
          <div class="passage-meta">${passage.level} · ${todayStr()}</div>
        </div>
        <button class="speak-btn" id="passage-speak" title="Listen to passage" style="font-size:20px;flex-shrink:0;margin-top:4px">🔊</button>
      </div>
      <div class="passage-body">${passage.body.replace(/\n/g,'<br/><br/>')}</div>
    </div>

    <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px">Comprehension questions</div>

    ${passage.questions.map((q,qi) => `
    <div class="passage-card" id="pq-${qi}">
      <div class="passage-q">${qi+1}. ${q.q}</div>
      <div id="popts-${qi}">
        ${q.opts.map((o,oi) => `<button class="passage-opt" data-qi="${qi}" data-oi="${oi}">${String.fromCharCode(65+oi)}. ${o}</button>`).join('')}
      </div>
      <div class="passage-fb" id="pfb-${qi}"></div>
    </div>`).join('')}

    <div id="passage-score-area"></div>`;

  // Speak button
  document.getElementById('passage-speak').addEventListener('click', function() {
    const plain = passage.body.replace(/<[^>]+>/g,'');
    speak(plain, this);
  });

  // Question answering
  document.querySelectorAll('.passage-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const qi = parseInt(btn.dataset.qi);
      const oi = parseInt(btn.dataset.oi);
      const q = passage.questions[qi];
      document.querySelectorAll(`[data-qi="${qi}"]`).forEach(b => b.disabled = true);
      const fb = document.getElementById(`pfb-${qi}`);
      if (oi === q.ans) {
        btn.classList.add('correct');
        fb.textContent = '✓ Correct! ' + q.exp;
        fb.className = 'passage-fb show qfb-ok';
        qCorrect++;
      } else {
        btn.classList.add('wrong');
        document.querySelector(`[data-qi="${qi}"][data-oi="${q.ans}"]`).classList.add('correct');
        fb.textContent = '✗ ' + q.exp;
        fb.className = 'passage-fb show qfb-no';
      }
      qAnswered++;
      if (qAnswered === total) {
        const pct = Math.round(qCorrect/total*100);
        const grade = pct===100?'Perfect! 🎉':pct>=67?'Well done!':'Keep reading!';
        document.getElementById('passage-score-area').innerHTML = `
          <div class="passage-card passage-score">
            <div class="passage-score-n">${qCorrect}/${total}</div>
            <div class="passage-score-l">${grade}</div>
          </div>`;
      }
    });
  });
}
